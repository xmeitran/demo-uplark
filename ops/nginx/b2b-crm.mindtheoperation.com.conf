# Install under /etc/nginx/sites-available/b2b-crm.mindtheoperation.com
# after DNS/TLS are ready. This canonical product route points directly to the
# standalone B2B app compose ports and does not require socat bridge containers.

server {
  listen 80;
  listen [::]:80;
  server_name b2b-crm.mindtheoperation.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name b2b-crm.mindtheoperation.com;

  ssl_certificate /etc/ssl/certs/cloudflare-origin.pem;
  ssl_certificate_key /etc/ssl/private/cloudflare-origin-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Alt-Svc "clear" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'self' https://*.larksuite.com https://*.feishu.cn" always;

  location = /api/health {
    proxy_pass http://127.0.0.1:4400/api/health;
    access_log off;
    include /etc/nginx/snippets/lark-crm-proxy-headers.conf;
  }

  location = /api/ready {
    proxy_pass http://127.0.0.1:4400/api/ready;
    access_log off;
    include /etc/nginx/snippets/lark-crm-proxy-headers.conf;
  }

  location = /health {
    proxy_pass http://127.0.0.1:4400/health;
    access_log off;
    include /etc/nginx/snippets/lark-crm-proxy-headers.conf;
  }

  location = /lark/events/callback {
    proxy_pass http://127.0.0.1:4400/lark/events/callback;
    include /etc/nginx/snippets/lark-crm-proxy-headers.conf;
  }

  location ^~ /files/download/ {
    proxy_pass http://127.0.0.1:4400;
    include /etc/nginx/snippets/lark-crm-proxy-headers.conf;
  }

  location ^~ /project-progress-shares/public/ {
    proxy_pass http://127.0.0.1:4400;
    include /etc/nginx/snippets/lark-crm-proxy-headers.conf;
  }

  # Keep Next.js as the public web/API facade. Lark OAuth start/callback is a
  # web BFF flow so it must continue through the web container.
  location / {
    proxy_pass http://127.0.0.1:3004;
    include /etc/nginx/snippets/lark-crm-proxy-headers.conf;
  }
}
